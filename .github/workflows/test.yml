name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Test app, PDF and providers
        run: python -m pytest tests -q
      - name: Check release boundary
        run: python scripts/check_release.py
      - name: Check offline math rendering
        run: node tests/test_math.cjs
      - name: Check standalone HTML math rendering
        run: node tests/test_offline_math.cjs
      - name: Check model picker interactions
        run: node tests/test_model_picker.cjs
      - name: Check figure labels and outline
        run: node tests/test_outline_labels.cjs
      - name: Check long-document scrolling
        run: node tests/test_reading_position.cjs
      - name: Check multi-format imports
        run: node tests/test_import_formats.cjs
      - name: Check viewport math scheduling
        run: node tests/test_math_viewport.cjs
      - name: Check incremental paper updates
        run: node tests/test_poll_rendering.cjs
      - name: Check saved PDF layout upgrades
        run: node tests/test_reparse_updates.cjs
      - name: Check AI layout and structured reading
        run: node tests/test_ai_layout_ui.cjs
