name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Test app, PDF and providers
        run: python -m pytest tests -q
      - name: Check release boundary
        run: python scripts/check_release.py
      - name: Check offline math rendering
        run: node tests/test_math.cjs
      - name: Check model picker interactions
        run: node tests/test_model_picker.cjs
      - name: Check figure labels and outline
        run: node tests/test_outline_labels.cjs
